version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/4.4
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
